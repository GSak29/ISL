<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to ISL | Professional Suite</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Specific overrides for V2A if needed, otherwise rely on styles.css */
        .preview-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
        }

        .video-container {
            position: relative;
            background: #000;
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-player {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        .video-placeholder {
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Navbar for mobile -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top d-md-none">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Voice to ISL</a>
            <a href="/" class="btn btn-sm btn-outline-primary">Back</a>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="d-none d-md-block mb-4">
                    <h4 class="text-white fw-bold mb-0">ISL Translator</h4>
                    <small class="text-muted">Voice to Animation</small>
                </div>

                <div class="mb-4 d-none d-md-block">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm w-100 text-start">
                        <i class="fas fa-chevron-left me-2"></i> Back to Home
                    </a>
                </div>

                <!-- Controls -->
                <h5>Controls</h5>
                <button id="start-detection-btn" class="control-btn btn-start">
                    <i class="fas fa-microphone"></i> Start Voice
                </button>
                <button id="stop-detection-btn" class="control-btn btn-stop">
                    <i class="fas fa-stop"></i> Stop
                </button>
                <button id="clear-btn" class="control-btn btn-clear">
                    <i class="fas fa-eraser"></i> Clear
                </button>

                <!-- Status -->
                <div class="mt-4 pt-3 border-top border-secondary">
                    <small class="text-muted d-block mb-1">Status</small>
                    <div id="status-indicator" class="d-flex align-items-center text-secondary">
                        <i class="fas fa-circle me-2 small"></i> <span>Ready</span>
                    </div>
                </div>

                <!-- Hidden elements for compatibility -->
                <div class="d-none">
                    <button id="mic-button"></button>
                    <div id="mic-status"></div>
                    <button id="translate-btn"></button>
                    <button id="ai-analyze-btn"></button>
                    <button id="test-sequence-btn"></button>
                    <button id="change-api-btn"></button>
                    <div id="api-status"></div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4 bg-light">
                <div class="container-fluid h-100 d-flex flex-column">

                    <!-- Top Area: Video and Chunks -->
                    <div class="row g-4 mb-4">
                        <!-- Video Animation -->
                        <div class="col-lg-8">
                            <div class="card shadow-sm h-100 border-0">
                                <div class="card-header bg-white border-0 fw-bold text-uppercase small text-muted">
                                    <i class="fas fa-video me-2"></i> Animation Preview
                                </div>
                                <div class="card-body p-0 bg-black rounded-bottom d-flex align-items-center justify-content-center"
                                    style="min-height: 400px;">
                                    <div class="video-container">
                                        <div class="spinner-border text-primary" id="center-spinner"
                                            style="display:none;"></div>
                                        <video id="video-player" class="video-player" autoplay playsinline></video>
                                        <div id="video-placeholder" class="video-placeholder">
                                            <i class="fas fa-sign-language fa-3x mb-3"></i>
                                            <p>ISL animations will play here<br><small>Speak to begin</small></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Chunks/Process -->
                        <div class="col-lg-4">
                            <div class="card shadow-sm h-100 border-0">
                                <div
                                    class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-uppercase small text-muted"><i
                                            class="fas fa-cogs me-2"></i> Processing</span>
                                    <span class="badge bg-secondary" id="chunk-count">0</span>
                                </div>
                                <div class="card-body overflow-auto" style="height: 400px; background: #f8f9fa;"
                                    id="chunks-panel">
                                    <div class="text-center text-muted mt-5">
                                        <small>Waiting for input...</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Transcript Area -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">
                                    <h6 class="card-subtitle mb-2 text-muted fw-bold text-uppercase small">Transcript
                                    </h6>
                                    <div id="transcript" class="p-3 bg-white border rounded text-dark"
                                        style="min-height: 60px;"></div>

                                    <div class="mt-3">
                                        <label class="small text-muted mb-1">Queue</label>
                                        <div id="word-queue" class="d-flex flex-wrap gap-2"></div>
                                    </div>

                                    <div class="mt-2">
                                        <div class="progress" style="height: 5px;">
                                            <div id="progress-fill" class="progress-bar bg-primary" role="progressbar"
                                                style="width: 0%"></div>
                                        </div>
                                        <small id="progress-text" class="text-muted d-block mt-1 text-end">0/0
                                            words</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        class VoiceToISLTranslator {
            constructor() {
                this.isRecording = false;
                this.recognition = null;
                this.currentTranscript = '';
                this.currentWordIndex = 0;
                this.wordQueue = [];
                this.totalWordsTranslated = 0;
                this.sessionsCompleted = 0;
                this.isTranslating = false;
                this.grokApiKey = null;
                this.isVideoPlaying = false;

                this.initializeElements();
                this.setupSpeechRecognition();
                this.setupEventListeners();
                this.setupDemoAnimations();
                this.initializeGrokAPI();
            }

            initializeElements() {
                // New UI elements
                this.startBtn = document.getElementById('start-detection-btn');
                this.stopBtn = document.getElementById('stop-detection-btn');
                this.clearBtn = document.getElementById('clear-btn');

                this.statusIndicator = document.getElementById('status-indicator');
                this.transcript = document.getElementById('transcript');
                this.videoPlayer = document.getElementById('video-player');
                this.videoPlaceholder = document.getElementById('video-placeholder');
                this.spinner = document.getElementById('center-spinner');

                this.progressFill = document.getElementById('progress-fill');
                this.progressText = document.getElementById('progress-text');
                this.wordQueueElement = document.getElementById('word-queue');
                this.chunksPanel = document.getElementById('chunks-panel');
                this.chunkCount = document.getElementById('chunk-count');

                // Hidden compatibility
                this.micButton = document.getElementById('mic-button');
                this.micStatus = document.getElementById('mic-status');
            }

            setupSpeechRecognition() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = true;
                    this.recognition.interimResults = true;
                    this.recognition.lang = 'en-IN';

                    this.recognition.onstart = () => {
                        this.isRecording = true;
                        this.updateUI();
                    };

                    this.recognition.onresult = (event) => {
                        let finalTranscript = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            if (event.results[i].isFinal) {
                                finalTranscript += event.results[i][0].transcript;
                            }
                        }
                        if (finalTranscript) {
                            this.transcript.innerText += ' ' + finalTranscript;
                            // Small delay to ensure text is processed? No, just call directly.
                            console.log("Transcript received:", finalTranscript);
                            this.detectAndPlayWords(finalTranscript);
                        }
                    };

                    this.recognition.onend = () => {
                        this.isRecording = false;
                        this.updateUI();
                    };

                    this.recognition.onerror = (e) => {
                        console.error(e);
                        this.isRecording = false;
                        this.updateUI();
                        this.updateStatus('Error: ' + e.error, 'danger');
                    }
                } else {
                    alert('Speech recognition not supported');
                }
            }

            setupEventListeners() {
                this.startBtn.addEventListener('click', () => {
                    if (!this.isRecording) {
                        try {
                            this.recognition.start();
                        } catch (e) { console.error(e); }
                    }
                });

                this.stopBtn.addEventListener('click', () => {
                    if (this.isRecording) {
                        this.recognition.stop();
                    }
                });

                this.clearBtn.addEventListener('click', () => {
                    this.transcript.innerText = '';
                    this.wordQueueElement.innerHTML = '';
                    this.chunksPanel.innerHTML = '<div class="text-center text-muted mt-5"><small>Waiting for input...</small></div>';
                    this.chunkCount.innerText = '0';
                    this.progressFill.style.width = '0%';
                    this.progressText.innerText = '0/0 words';
                    this.stopVideo();
                    this.wordQueue = [];
                });

                this.videoPlayer.addEventListener('ended', () => {
                    this.playNextInQueue();
                });
            }

            updateUI() {
                if (this.isRecording) {
                    this.updateStatus('Listening...', 'success');
                    this.startBtn.classList.add('disabled');
                    this.stopBtn.classList.remove('disabled');
                } else {
                    this.updateStatus('Stopped', 'secondary');
                    this.startBtn.classList.remove('disabled');
                    this.stopBtn.classList.add('disabled');
                }
            }

            updateStatus(text, type) {
                const colorClass = type === 'success' ? 'text-success' : (type === 'danger' ? 'text-danger' : 'text-secondary');
                this.statusIndicator.className = `d-flex align-items-center ${colorClass}`;
                this.statusIndicator.querySelector('span').innerText = text;
                this.statusIndicator.querySelector('i').className = `fas fa-circle me-2 small`;
            }

            async initializeGrokAPI() {
                try {
                    const response = await fetch('/api/grok-key');
                    if (response.ok) {
                        const data = await response.json();
                        this.grokApiKey = data.apiKey;
                    }
                } catch (e) { console.error(e); }
            }

            setupDemoAnimations() {
                // FIXED: Use Flask static folder structure
                const baseUrl = window.location.origin;
                const createVideoUrl = (filename) => `${baseUrl}/static/video/${encodeURIComponent(filename)}`;

                // Add more sophisticated variation handling if needed
                this.videoAnimations = {
                    'afternoon': createVideoUrl('AFTERNOON.MOV'),
                    'bad': createVideoUrl('BAD.MOV'),
                    'boy': createVideoUrl('BOY.MOV'),
                    'brother': createVideoUrl('BROTHER.MOV'),
                    'bye': createVideoUrl('BYE.MOV'),
                    'child': createVideoUrl('CHILD.MOV'),
                    'college': createVideoUrl('COLLEGE.MOV'),
                    'day': createVideoUrl('DAY.MOV'),
                    'eat': createVideoUrl('EAT.MOV'),
                    'family': createVideoUrl('FAMILY.MOV'),
                    'father': createVideoUrl('FATHER.MOV'),
                    'fine': createVideoUrl('FINE.MOV'),
                    'food': createVideoUrl('FOOD.MOV'),
                    'friend': createVideoUrl('FRIEND.MOV'),
                    'girl': createVideoUrl('GIRL.MOV'),
                    'good': createVideoUrl('GOOD.MOV'),
                    'he': createVideoUrl('HE.MOV'),
                    'hello': createVideoUrl('HELLO.MOV'),
                    'help': createVideoUrl('HELP.MOV'),
                    'home': createVideoUrl('HOME.MOV'),
                    'hospital': createVideoUrl('HOSPITAL.MOV'),
                    'how': createVideoUrl('HOW.MOV'),
                    'i': createVideoUrl('I.MOV'),
                    'indian': createVideoUrl('INDIAN.MOV'),
                    'language': createVideoUrl('LANGUAGE.MOV'),
                    'loud': createVideoUrl('LOUD.MOV'),
                    'man': createVideoUrl('MAN.MOV'),
                    'market': createVideoUrl('MARKET.MOV'),
                    'morning': createVideoUrl('MORNING.MOV'),
                    'mummy': createVideoUrl('MUMMY.MOV'),
                    'namaste': createVideoUrl('NAMASTE.MOV'),
                    'name': createVideoUrl('NAME.MOV'),
                    'night': createVideoUrl('NIGHT.MOV'),
                    'no': createVideoUrl('NO.MOV'),
                    'office': createVideoUrl('OFFICE.MOV'),
                    'place': createVideoUrl('PLACE.MOV'),
                    'play': createVideoUrl('PLAY.MOV'),
                    'please': createVideoUrl('PLEASE.MOV'),
                    'quiet': createVideoUrl('QUIET.MOV'),
                    'run': createVideoUrl('RUN.MOV'),
                    'school': createVideoUrl('SCHOOL.MOV'),
                    'she': createVideoUrl('SHE.MOV'),
                    'shop': createVideoUrl('SHOP.MOV'),
                    'sign': createVideoUrl('SIGN.MOV'),
                    'sit': createVideoUrl('SIT.MOV'),
                    'sleep': createVideoUrl('SLEEP.MOV'),
                    'sorry': createVideoUrl('SORRY.MOV'),
                    'stand': createVideoUrl('STAND.MOV'),
                    'strong': createVideoUrl('STRONG.MOV'),
                    'teacher': createVideoUrl('TEACHER.MOV'),
                    'temple': createVideoUrl('TEMPLE.MOV'),
                    'thank': createVideoUrl('THANK YOU.MOV'),
                    'thanks': createVideoUrl('THANK YOU.MOV'), // Added variation
                    'thank you': createVideoUrl('THANK YOU.MOV'), // Added variation
                    'they': createVideoUrl('THEY.MOV'),
                    'time': createVideoUrl('TIME.MOV'),
                    'today': createVideoUrl('TODAY.MOV'),
                    'tomorrow': createVideoUrl('TOMORROW.MOV'),
                    'water': createVideoUrl('WATER.MOV'),
                    'we': createVideoUrl('WE.MOV'),
                    'week': createVideoUrl('WEEK.MOV'),
                    'welcome': createVideoUrl('WELCOME.MOV'),
                    'woman': createVideoUrl('WOMAN.MOV'),
                    'year': createVideoUrl('YEAR.MOV'),
                    'yes': createVideoUrl('YES.MOV'),
                    'yesterday': createVideoUrl('YESTERDAY.MOV'),
                    'you': createVideoUrl('YOU.MOV'),
                    'your': createVideoUrl('YOUR.MOV'),
                };
            }

            async detectAndPlayWords(text) {
                console.log("Analyzing text:", text);

                // 1. Send to AI for processing
                let textToProcess = text;
                try {
                    const response = await fetch('/api/process_speech', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });
                    if (response.ok) {
                        const data = await response.json();
                        textToProcess = data.processed;
                        console.log("AI Processed Text:", textToProcess);
                        // Optional: Show AI result in UI
                        this.transcript.innerHTML += `<br><small class="text-primary"><i class="fas fa-robot"></i> ${textToProcess}</small>`;
                    }
                } catch (e) {
                    console.error("AI Processing failed:", e);
                }

                // 2. Process words
                // Clean punctuation and split
                const words = textToProcess.toLowerCase()
                    .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                    .split(/\s+/);

                const foundWords = [];
                const missingWords = [];

                words.forEach(w => {
                    const match = this.videoAnimations[w] || this.videoAnimations[w.replace(/[^a-z]/g, '')];
                    if (match) {
                        foundWords.push(w);
                    } else if (w.length > 1) { // Ignore single chars if not found or very short noise
                        missingWords.push(w);
                    }
                });

                // 3. Update UI
                if (foundWords.length > 0) {
                    this.wordQueue.push(...foundWords);
                    if (!this.isVideoPlaying) {
                        this.playNextInQueue();
                    }
                }

                this.updateQueueUI(foundWords, missingWords);
            }

            updateQueueUI(newFound = [], newMissing = []) {
                // Main Queue (Pending)
                this.wordQueueElement.innerHTML = this.wordQueue.map(w =>
                    `<span class="badge bg-success mb-1">${w}</span>`
                ).join(' ');

                this.chunkCount.innerText = this.wordQueue.length;

                // Show missing words if any (append to a log or distinct area)
                if (newMissing.length > 0) {
                    const missingContainer = document.getElementById('missing-words-log') || this.createMissingContainer();

                    newMissing.forEach(w => {
                        const span = document.createElement('span');
                        span.className = 'badge bg-danger me-1 mb-1';
                        span.innerText = w;
                        missingContainer.prepend(span); // Newest first
                    });
                }
            }

            createMissingContainer() {
                // Create a container for missing words if it doesn't exist
                const parent = this.chunksPanel.parentElement;

                // Add header if needed
                if (!document.getElementById('missing-header')) {
                    const header = document.createElement('div');
                    header.id = 'missing-header';
                    header.className = 'card-header bg-white border-0 fw-bold text-uppercase small text-muted border-top mt-3';
                    header.innerHTML = '<i class="fas fa-exclamation-circle me-2"></i> Animations Not Found';
                    // Insert after the chunks body
                    this.chunksPanel.after(header);

                    const body = document.createElement('div');
                    body.id = 'missing-words-log';
                    body.className = 'card-body overflow-auto bg-light';
                    body.style.height = '150px';
                    header.after(body);
                    return body;
                }
                return document.getElementById('missing-words-log');
            }

            playNextInQueue() {
                if (this.wordQueue.length === 0) {
                    this.isVideoPlaying = false;
                    this.stopVideo();
                    return;
                }

                this.isVideoPlaying = true;
                const word = this.wordQueue.shift();

                // Get URL handle variations
                let url = this.videoAnimations[word];
                if (!url) url = this.videoAnimations[word.replace(/[^a-z]/g, '')];

                if (url) {
                    console.log("Playing video for:", word, url);
                    this.videoPlaceholder.style.display = 'none';
                    this.videoPlayer.style.display = 'block';
                    this.videoPlayer.src = url;
                    this.videoPlayer.play().catch(e => {
                        console.error("Video play error:", e);
                        // If error, skip to next
                        this.playNextInQueue();
                    });
                    this.highlightWord(word);
                } else {
                    console.warn("No video found for:", word);
                    this.playNextInQueue();
                }
                this.updateQueueUI();
            }

            stopVideo() {
                this.videoPlayer.pause();
                this.videoPlayer.style.display = 'none';
                this.videoPlaceholder.style.display = 'block';
            }

            updateQueueUI() {
                // Simplified queue update
                this.wordQueueElement.innerHTML = this.wordQueue.map(w => `<span class="badge bg-secondary">${w}</span>`).join(' ');
                this.chunkCount.innerText = this.wordQueue.length;
            }

            highlightWord(word) {
                // Visual feedback logic if needed
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.translator = new VoiceToISLTranslator();
        });
    </script>
</body>

</html>
