<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to ISL | Professional Suite</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Specific overrides for V2A if needed, otherwise rely on styles.css */
        .preview-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
        }

        .video-container {
            position: relative;
            background: #000;
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-player {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        .video-placeholder {
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Navbar for mobile -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top d-md-none">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Voice to ISL</a>
            <a href="/" class="btn btn-sm btn-outline-primary">Back</a>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="d-none d-md-block mb-4">
                    <h4 class="text-white fw-bold mb-0">ISL Translator</h4>
                    <small class="text-muted">Voice to Animation</small>
                </div>

                <div class="mb-4 d-none d-md-block">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm w-100 text-start">
                        <i class="fas fa-chevron-left me-2"></i> Back to Home
                    </a>
                </div>

                <!-- Controls -->
                <h5>Controls</h5>
                <button id="start-detection-btn" class="control-btn btn-start">
                    <i class="fas fa-microphone"></i> Start Voice
                </button>
                <button id="stop-detection-btn" class="control-btn btn-stop">
                    <i class="fas fa-stop"></i> Stop
                </button>
                <button id="clear-btn" class="control-btn btn-clear">
                    <i class="fas fa-eraser"></i> Clear
                </button>

                <!-- Status -->
                <div class="mt-4 pt-3 border-top border-secondary">
                    <small class="text-muted d-block mb-1">Status</small>
                    <div id="status-indicator" class="d-flex align-items-center text-secondary">
                        <i class="fas fa-circle me-2 small"></i> <span>Ready</span>
                    </div>
                </div>

                <!-- Hidden elements for compatibility -->
                <div class="d-none">
                    <button id="mic-button"></button>
                    <div id="mic-status"></div>
                    <button id="translate-btn"></button>
                    <button id="ai-analyze-btn"></button>
                    <button id="test-sequence-btn"></button>
                    <button id="change-api-btn"></button>
                    <div id="api-status"></div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4 bg-light">
                <div class="container-fluid h-100 d-flex flex-column">

                    <!-- Top Area: Video and Chunks -->
                    <div class="row g-4 mb-4">
                        <!-- Video Animation -->
                        <div class="col-lg-8">
                            <div class="card shadow-sm h-100 border-0">
                                <div class="card-header bg-white border-0 fw-bold text-uppercase small text-muted">
                                    <i class="fas fa-video me-2"></i> Animation Preview
                                </div>
                                <div class="card-body p-0 bg-black rounded-bottom d-flex align-items-center justify-content-center"
                                    style="min-height: 400px;">
                                    <div class="video-container">
                                        <div class="spinner-border text-primary" id="center-spinner"
                                            style="display:none;"></div>
                                        <video id="video-player" class="video-player" autoplay playsinline></video>
                                        <div id="video-placeholder" class="video-placeholder">
                                            <i class="fas fa-sign-language fa-3x mb-3"></i>
                                            <p>ISL animations will play here<br><small>Speak to begin</small></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Chunks/Process -->
                        <div class="col-lg-4">
                            <div class="card shadow-sm h-100 border-0">
                                <div
                                    class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-uppercase small text-muted"><i
                                            class="fas fa-cogs me-2"></i> Processing</span>
                                    <span class="badge bg-secondary" id="chunk-count">0</span>
                                </div>
                                <div class="card-body overflow-auto" style="height: 400px; background: #f8f9fa;"
                                    id="chunks-panel">
                                    <div class="text-center text-muted mt-5">
                                        <small>Waiting for input...</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Transcript Area -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">
                                    <h6 class="card-subtitle mb-2 text-muted fw-bold text-uppercase small">Transcript
                                    </h6>
                                    <div id="transcript" class="p-3 bg-white border rounded text-dark"
                                        style="min-height: 60px;"></div>

                                    <div class="mt-3">
                                        <label class="small text-muted mb-1">Queue</label>
                                        <div id="word-queue" class="d-flex flex-wrap gap-2"></div>
                                    </div>

                                    <div class="mt-2">
                                        <div class="progress" style="height: 5px;">
                                            <div id="progress-fill" class="progress-bar bg-primary" role="progressbar"
                                                style="width: 0%"></div>
                                        </div>
                                        <small id="progress-text" class="text-muted d-block mt-1 text-end">0/0
                                            words</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        class VoiceToISLTranslator {
            constructor() {
                this.isRecording = false;
                this.recognition = null;
                this.currentTranscript = '';
                this.wordQueue = [];
                this.isVideoPlaying = false;

                this.initializeElements();
                this.setupSpeechRecognition();
                this.setupEventListeners();
            }

            initializeElements() {
                this.startBtn = document.getElementById('start-detection-btn');
                this.stopBtn = document.getElementById('stop-detection-btn');
                this.clearBtn = document.getElementById('clear-btn');
                this.statusIndicator = document.getElementById('status-indicator');
                this.transcript = document.getElementById('transcript');
                this.videoPlayer = document.getElementById('video-player');
                this.videoPlaceholder = document.getElementById('video-placeholder');
                this.spinner = document.getElementById('center-spinner');
                this.progressFill = document.getElementById('progress-fill');
                this.progressText = document.getElementById('progress-text');
                this.wordQueueElement = document.getElementById('word-queue');
                this.chunksPanel = document.getElementById('chunks-panel');
                this.chunkCount = document.getElementById('chunk-count');
            }

            setupSpeechRecognition() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = true;
                    this.recognition.interimResults = false; // We only want final results for processing
                    this.recognition.lang = 'en-IN';

                    this.recognition.onstart = () => {
                        this.isRecording = true;
                        this.updateUI();
                    };

                    this.recognition.onresult = (event) => {
                        let finalTranscript = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            if (event.results[i].isFinal) {
                                finalTranscript += event.results[i][0].transcript;
                            }
                        }
                        if (finalTranscript) {
                            this.transcript.innerText += ' ' + finalTranscript;
                            this.processSpeech(finalTranscript);
                        }
                    };

                    this.recognition.onend = () => {
                        this.isRecording = false;
                        this.updateUI();
                    };

                    this.recognition.onerror = (e) => {
                        console.error(e);
                        this.isRecording = false;
                        this.updateUI();
                        this.updateStatus('Error: ' + e.error, 'danger');
                    }
                } else {
                    alert('Speech recognition not supported');
                }
            }

            setupEventListeners() {
                this.startBtn.addEventListener('click', () => {
                    if (!this.isRecording) {
                        try {
                            this.recognition.start();
                        } catch (e) { console.error(e); }
                    }
                });

                this.stopBtn.addEventListener('click', () => {
                    if (this.isRecording) {
                        this.recognition.stop();
                    }
                });

                this.clearBtn.addEventListener('click', () => {
                    this.transcript.innerText = '';
                    this.wordQueue = [];
                    this.updateQueueUI();
                    this.chunksPanel.innerHTML = '<div class="text-center text-muted mt-5"><small>Waiting for input...</small></div>';
                    this.stopVideo();
                });

                this.videoPlayer.addEventListener('ended', () => {
                    this.playNextInQueue();
                });

                this.videoPlayer.addEventListener('error', (e) => {
                    console.error("Video error:", e);
                    this.playNextInQueue(); // Skip to next if error
                });
            }

            updateUI() {
                if (this.isRecording) {
                    this.updateStatus('Listening...', 'success');
                    this.startBtn.classList.add('disabled');
                    this.stopBtn.classList.remove('disabled');
                } else {
                    this.updateStatus('Stopped', 'secondary');
                    this.startBtn.classList.remove('disabled');
                    this.stopBtn.classList.add('disabled');
                }
            }

            updateStatus(text, type) {
                const colorClass = type === 'success' ? 'text-success' : (type === 'danger' ? 'text-danger' : 'text-secondary');
                this.statusIndicator.className = `d-flex align-items-center ${colorClass}`;
                this.statusIndicator.querySelector('span').innerText = text;
                this.statusIndicator.querySelector('i').className = `fas fa-circle me-2 small`;
            }

            async processSpeech(text) {
                this.updateStatus('Processing AI...', 'warning');

                // Show loading in chunks panel
                const loadingId = Date.now();
                const tempLoading = document.createElement('div');
                tempLoading.className = 'card mb-2 border-0 shadow-sm';
                tempLoading.id = `loading-${loadingId}`;
                tempLoading.innerHTML = `
                    <div class="card-body p-2 d-flex align-items-center">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        <small class="text-muted">Analyzing: "${text}"...</small>
                    </div>
                `;

                // Remove empty state if present
                if (this.chunksPanel.querySelector('.text-center')) {
                    this.chunksPanel.innerHTML = '';
                }
                this.chunksPanel.prepend(tempLoading);

                try {
                    const response = await fetch('/api/process-text', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text: text })
                    });

                    if (!response.ok) throw new Error('Network response was not ok');

                    const data = await response.json();

                    // Remove loading indicator
                    tempLoading.remove();

                    if (data.word_analysis) {
                        this.displayWordAnalysis(data.word_analysis);
                    }

                    if (data.final_sign_sequence && data.final_sign_sequence.length > 0) {
                        this.addSequenceToPlaybackQueue(data.final_sign_sequence);
                    }

                    this.updateStatus('Translation Ready', 'success');

                } catch (error) {
                    console.error('Error processing speech:', error);
                    tempLoading.innerHTML = `
                        <div class="card-body p-2 text-danger">
                            <i class="fas fa-exclamation-circle me-2"></i> Error processing: "${text}"
                        </div>
                    `;
                    this.updateStatus('Error processing', 'danger');
                }

                if (this.isRecording) {
                    this.updateStatus('Listening...', 'success');
                } else {
                    this.updateStatus('Stopped', 'secondary');
                }
            }

            displayWordAnalysis(analysis) {
                // New logic: Show original words with Green/Red status
                const chunkDiv = document.createElement('div');
                chunkDiv.className = 'card mb-2 border-0 shadow-sm slide-in-bottom';

                let wordBadges = analysis.map(item => {
                    const isAvailable = item.status === 'available';
                    const badgeClass = isAvailable ? 'bg-success' : 'bg-danger';
                    const icon = isAvailable ? 'check' : 'times';
                    // Show original spoken word, maybe tooltip mapped sign
                    return `<span class="badge ${badgeClass} me-1 mb-1" title="Mapped: ${item.mapped_sign || 'None'}">
                        ${item.spoken_word} <i class="fas fa-${icon} ms-1" style="font-size: 0.7em;"></i>
                    </span>`;
                }).join('');

                chunkDiv.innerHTML = `
                    <div class="card-body p-3">
                        <div>${wordBadges}</div>
                    </div>
                `;

                this.chunksPanel.prepend(chunkDiv);
            }

            addSequenceToPlaybackQueue(sequence) {
                // sequence contains objects with { word, video_url }
                // Add to main playback queue
                this.wordQueue.push(...sequence);

                this.updateQueueUI();

                if (!this.isVideoPlaying) {
                    this.playNextInQueue();
                }
            }

            playNextInQueue() {
                // Find next available video
                let nextItemIndex = this.wordQueue.findIndex(item => item.available && !item.played);

                if (nextItemIndex === -1) {
                    // No more available videos to play in the queue
                    // Mark all as played or clear if you want loop? 
                    // For now, we just stop.
                    this.isVideoPlaying = false;
                    this.stopVideo();
                    return;
                }

                this.isVideoPlaying = true;
                const item = this.wordQueue[nextItemIndex];
                item.played = true; // Mark as played

                // Update UI to highlight current word
                this.updateQueueUI(nextItemIndex); // Pass index relative to queue start? No, queue grows.

                this.videoPlaceholder.style.display = 'none';
                this.videoPlayer.style.display = 'block';
                this.videoPlayer.src = item.video_url;
                this.videoPlayer.play().catch(e => {
                    console.error("Play error", e);
                    this.playNextInQueue();
                });
            }

            stopVideo() {
                this.videoPlayer.pause();
                this.videoPlayer.style.display = 'none';
                this.videoPlaceholder.style.display = 'block';
            }

            updateQueueUI(activeIndex = -1) {
                // Main visual queue (side card in original request, but user asked for "queued words mark")
                // We'll update the word-queue container

                // Filter out fully played items if queue gets too long? 
                // For now, keep them but maybe dim them.

                this.wordQueueElement.innerHTML = this.wordQueue.map((item, index) => {
                    let badgeClass = item.available ? 'bg-primary' : 'bg-secondary';
                    let opacity = '1';
                    let border = '';

                    if (item.played && index !== activeIndex) {
                        badgeClass = item.available ? 'bg-success' : 'bg-secondary';
                        opacity = '0.6';
                    }

                    if (index === activeIndex) {
                        border = 'border: 2px solid #ffc107; box-shadow: 0 0 5px #ffc107;';
                        opacity = '1';
                        badgeClass = 'bg-primary';
                    }

                    if (!item.available) {
                        opacity = '0.5';
                        badgeClass = 'bg-danger';
                    }

                    return `<span class="badge ${badgeClass} mb-1" style="opacity: ${opacity}; ${border}">
                        ${item.word}
                    </span>`;
                }).join(' ');

                // Update counts
                this.chunkCount.innerText = this.wordQueue.length;
                const playedCount = this.wordQueue.filter(i => i.played).length;
                this.progressText.innerText = `${playedCount}/${this.wordQueue.length} played`;
                this.progressFill.style.width = this.wordQueue.length > 0 ? `${(playedCount / this.wordQueue.length) * 100}%` : '0%';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.translator = new VoiceToISLTranslator();
        });
    </script>
</body>

</html>
