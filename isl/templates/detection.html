<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISL Detection | Professional Suite</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Navbar for mobile/better nav -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top d-md-none">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ISL Translator</a>
            <a href="/" class="btn btn-sm btn-outline-primary">Back to Home</a>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="d-none d-md-block mb-4">
                    <h4 class="text-white fw-bold mb-0">ISL Translator</h4>
                    <small class="text-muted">Professional Edition</small>
                </div>

                <div class="mb-4 d-none d-md-block">
                    <a href="/" class="btn btn-outline-secondary btn-sm w-100 text-start">
                        <i class="fas fa-chevron-left me-2"></i> Back to Home
                    </a>
                </div>

                <!-- Settings -->
                <h5>Settings</h5>
                <!-- Hospital Mode Removed -->
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="showBoxes" checked>
                    <label class="form-check-label" for="showBoxes">Show Boxes</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="enableSpeech" checked>
                    <label class="form-check-label" for="enableSpeech">Text-to-Speech</label>
                </div>

                <!-- Controls -->
                <h5>Controls</h5>
                <button id="startBtn" class="control-btn btn-start">
                    <i class="fas fa-play"></i> Start
                </button>
                <button id="stopBtn" class="control-btn btn-stop">
                    <i class="fas fa-stop"></i> Stop
                </button>
                <button id="clearBtn" class="control-btn btn-clear">
                    <i class="fas fa-eraser"></i> Clear
                </button>

                <!-- Status -->
                <div class="mt-4 pt-3 border-top border-secondary">
                    <small class="text-muted d-block mb-1">Status</small>
                    <div id="statusIndicator" class="d-flex align-items-center text-success mb-2">
                        <i class="fas fa-circle me-2 small"></i> <span id="statusText">Ready</span>
                    </div>
                    <div id="aiStatus" class="d-flex align-items-center text-muted">
                        <i class="fas fa-robot me-2 small"></i> <span id="aiStatusText">Checking AI...</span>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4 bg-light">
                <div class="container-fluid h-100 d-flex flex-column">

                    <!-- Video Feed Area -->
                    <div class="row flex-grow-1 mb-4">
                        <div class="col-12">
                            <div class="card shadow-sm h-100 border-0"
                                style="background: #000; overflow: hidden; border-radius: 12px;">
                                <div class="video-container h-100 d-flex justify-content-center align-items-center">
                                    <img src="{{ url_for('video_feed') }}" id="videoFeed" alt="Live Feed"
                                        style="max-height: 100%; max-width: 100%; object-fit: contain;">
                                    <div id="videoLoading" class="loading-overlay">
                                        <div class="text-center text-white">
                                            <div class="spinner-border mb-3" role="status"></div>
                                            <p>Initializing Camera...</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Output Area -->
                    <div class="row g-3" style="max-height: 250px;">
                        <div class="col-md-4">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body">
                                    <h6 class="card-subtitle mb-2 text-muted fw-bold text-uppercase small">Detected
                                        Words</h6>
                                    <div id="detectedWords" class="p-2 bg-light rounded text-dark fw-bold"
                                        style="min-height: 60px;">
                                        <!-- Words -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body">
                                    <h6 class="card-subtitle mb-2 text-muted fw-bold text-uppercase small">Full Sentence
                                    </h6>
                                    <div id="fullSentence" class="p-2 bg-light rounded text-primary"
                                        style="min-height: 60px;">
                                        <!-- Sentence -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card h-100 border-0 shadow-sm bg-primary text-white">
                                <div class="card-body">
                                    <h6 class="card-subtitle mb-2 text-white-50 fw-bold text-uppercase small">AI
                                        Translation</h6>
                                    <div id="translation" class="fs-5 fst-italic">
                                        <!-- Translation -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
